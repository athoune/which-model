[project]
name = "which-model"
version = "0.1.0"
description = "Terminal dashboard comparing OpenCode Go models on real budget cost and coding benchmarks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
which-model = "which_model.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/which_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pylint.main]
# Prospector runs from its own virtualenv, which does not necessarily have the
# project's runtime dependencies installed. typer is a declared dependency,
# imported for real by the CLI, not a typo.
ignored-modules = ["typer"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "SIM"]
